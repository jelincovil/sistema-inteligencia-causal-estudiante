[workspace]
resolver = "2"
members = [
    "crates/argument-document",
    "crates/argument-audit",
    "crates/argument-card",
    "crates/argument-cli",
    "crates/arg-ingest",
    "crates/causal-ml",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
csv = "1.3"
walkdir = "2"
