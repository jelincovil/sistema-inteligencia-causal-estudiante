[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-causal"
version = "2.0.0"
description = "MCP causal — criterios de calidad, contratos y estimadores para sistemas causales"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Academic"}
authors = [{name = "Jaime Lincovil"}]
keywords = ["causal", "inference", "mcp", "data-engineering", "contracts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0", "pydantic>=2.5,<2.14"]
test = ["pytest>=7.0"]
full = ["mcp>=1.0", "pydantic>=2.5,<2.14", "pytest>=7.0"]

[project.scripts]
mcp-causal = "mcp_causal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_causal = ["resources/**/*.json", "resources/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
